<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Login Page</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="login-card">
      <div class="brand-mark" aria-hidden="true">L</div>
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Sign in to your account</h1>
      <p class="subtitle">Enter your details to continue.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com"
               autocomplete="username" required>

        <div class="password-heading">
          <label for="password">Password</label>
        </div>
        <input id="password" type="password" placeholder="Enter your password"
               autocomplete="current-password" required>

        <button type="submit">Sign in <span aria-hidden="true">→</span></button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <div class="demo-box">
        <strong>Demo account</strong>
        <span>Email: demo@example.com</span>
        <span>Password: demo123</span>
        <button type="button" id="resetDemo" class="reset-button">Reset demo account</button>
      </div>
      <p class="footer-note">JavaScript + Local Storage</p>
    </section>
  </main>
</body>
</html>
